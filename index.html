<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transCode.com - Code Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .dark {
            color-scheme: dark;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const LANGUAGES = [
            'Python', 'JavaScript', 'Java', 'C++', 'C#', 'TypeScript', 'PHP', 'Swift',
            'Kotlin', 'Go', 'Ruby', 'Rust', 'Scala', 'R', 'Objective-C', 'Dart',
            'Perl', 'Haskell', 'Lua', 'Shell', 'SQL', 'MATLAB', 'Groovy', 'Visual Basic', 'Elixir'
        ];

        const LanguageDropdown = ({ value, onChange, placeholder, isDark }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            const filteredLanguages = useMemo(() => {
                if (!searchTerm) return LANGUAGES;
                return LANGUAGES.filter(lang =>
                    lang.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [searchTerm]);

            const handleSelect = (lang) => {
                onChange(lang);
                setSearchTerm('');
                setIsOpen(false);
            };

            return (
                <div className="relative w-48">
                    <div className="relative">
                        <input
                            type="text"
                            className={`w-full px-4 py-2 border-2 rounded-lg focus:outline-none transition-colors ${
                                isDark 
                                    ? 'bg-gray-800 border-gray-600 text-white focus:border-blue-400' 
                                    : 'bg-white border-gray-300 text-gray-900 focus:border-blue-500'
                            }`}
                            placeholder={placeholder}
                            value={isOpen ? searchTerm : value}
                            onChange={(e) => {
                                setSearchTerm(e.target.value);
                                setIsOpen(true);
                            }}
                            onFocus={() => setIsOpen(true)}
                        />
                        <svg
                            className={`absolute right-3 top-3 w-4 h-4 pointer-events-none ${
                                isDark ? 'text-gray-400' : 'text-gray-400'
                            }`}
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                    
                    {isOpen && (
                        <>
                            <div
                                className="fixed inset-0 z-10"
                                onClick={() => {
                                    setIsOpen(false);
                                    setSearchTerm('');
                                }}
                            />
                            <div className={`absolute z-20 w-full mt-1 border-2 rounded-lg shadow-lg max-h-60 overflow-y-auto ${
                                isDark 
                                    ? 'bg-gray-800 border-gray-600' 
                                    : 'bg-white border-gray-300'
                            }`}>
                                {filteredLanguages.length > 0 ? (
                                    filteredLanguages.map((lang) => (
                                        <div
                                            key={lang}
                                            className={`px-4 py-2 cursor-pointer transition-colors ${
                                                isDark 
                                                    ? 'hover:bg-gray-700 text-white' 
                                                    : 'hover:bg-blue-50 text-gray-900'
                                            }`}
                                            onClick={() => handleSelect(lang)}
                                        >
                                            {lang}
                                        </div>
                                    ))
                                ) : (
                                    <div className={`px-4 py-2 ${isDark ? 'text-gray-400' : 'text-gray-500'}`}>
                                        لا توجد لغات
                                    </div>
                                )}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        function TransCode() {
            const [isDark, setIsDark] = useState(false);
            const [sourceLanguage, setSourceLanguage] = useState('Python');
            const [targetLanguage, setTargetLanguage] = useState('JavaScript');
            const [sourceCode, setSourceCode] = useState('');
            const [convertedCode, setConvertedCode] = useState('');
            const [isConverting, setIsConverting] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                }
            }, []);

            const toggleDarkMode = () => {
                setIsDark(!isDark);
                if (!isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            };

            const handleConvert = async () => {
                if (!sourceCode.trim()) {
                    setError('الرجاء إدخال كود للتحويل');
                    return;
                }

                if (!sourceLanguage || !targetLanguage) {
                    setError('الرجاء اختيار لغة المصدر ولغة الهدف');
                    return;
                }

                setIsConverting(true);
                setError('');
                setConvertedCode('');

                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [
                                {
                                    role: 'user',
                                    content: `Convert the following ${sourceLanguage} code to ${targetLanguage}. Only provide the converted code without any explanations or markdown formatting:\n\n${sourceCode}`
                                }
                            ]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.content && data.content[0] && data.content[0].text) {
                        setConvertedCode(data.content[0].text);
                    } else {
                        setError('فشل تحويل الكود. الرجاء المحاولة مرة أخرى.');
                    }
                } catch (err) {
                    setError('حدث خطأ أثناء التحويل: ' + err.message);
                } finally {
                    setIsConverting(false);
                }
            };

            return (
                <div className={`min-h-screen transition-colors duration-300 p-8 ${
                    isDark 
                        ? 'bg-gradient-to-br from-gray-900 to-gray-800' 
                        : 'bg-gradient-to-br from-blue-50 to-indigo-100'
                }`}>
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="flex justify-between items-center mb-8">
                            <h1 className={`text-4xl font-bold ${isDark ? 'text-white' : 'text-gray-800'}`}>
                                transCode.com
                            </h1>
                            
                            {/* Dark Mode Toggle */}
                            <button
                                onClick={toggleDarkMode}
                                className={`p-3 rounded-lg transition-all transform hover:scale-110 ${
                                    isDark 
                                        ? 'bg-gray-700 text-yellow-400 hover:bg-gray-600' 
                                        : 'bg-white text-gray-700 hover:bg-gray-100'
                                } shadow-lg`}
                                title={isDark ? 'الوضع الفاتح' : 'الوضع الداكن'}
                            >
                                {isDark ? (
                                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                        <path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" />
                                    </svg>
                                ) : (
                                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                                    </svg>
                                )}
                            </button>
                        </div>
                        
                        <div className={`rounded-xl shadow-2xl p-6 transition-colors ${
                            isDark ? 'bg-gray-800' : 'bg-white'
                        }`}>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Source Code Panel */}
                                <div className="flex flex-col">
                                    <div className="mb-4">
                                        <label className={`block text-sm font-semibold mb-2 ${
                                            isDark ? 'text-gray-200' : 'text-gray-700'
                                        }`}>
                                            لغة المصدر
                                        </label>
                                        <LanguageDropdown
                                            value={sourceLanguage}
                                            onChange={setSourceLanguage}
                                            placeholder="اختر اللغة..."
                                            isDark={isDark}
                                        />
                                    </div>
                                    
                                    <textarea
                                        className={`flex-1 min-h-[400px] p-4 border-2 rounded-lg font-mono text-sm focus:outline-none resize-none transition-colors ${
                                            isDark 
                                                ? 'bg-gray-900 border-gray-600 text-gray-100 focus:border-blue-400 placeholder-gray-500' 
                                                : 'bg-white border-gray-300 text-gray-900 focus:border-blue-500 placeholder-gray-400'
                                        }`}
                                        placeholder="أدخل الكود هنا..."
                                        value={sourceCode}
                                        onChange={(e) => setSourceCode(e.target.value)}
                                    />
                                </div>

                                {/* Target Code Panel */}
                                <div className="flex flex-col">
                                    <div className="mb-4">
                                        <label className={`block text-sm font-semibold mb-2 ${
                                            isDark ? 'text-gray-200' : 'text-gray-700'
                                        }`}>
                                            لغة الهدف
                                        </label>
                                        <LanguageDropdown
                                            value={targetLanguage}
                                            onChange={setTargetLanguage}
                                            placeholder="اختر اللغة..."
                                            isDark={isDark}
                                        />
                                    </div>
                                    
                                    <textarea
                                        className={`flex-1 min-h-[400px] p-4 border-2 rounded-lg font-mono text-sm resize-none transition-colors ${
                                            isDark 
                                                ? 'bg-gray-900 border-gray-600 text-gray-100 placeholder-gray-500' 
                                                : 'bg-gray-50 border-gray-300 text-gray-900 placeholder-gray-400'
                                        }`}
                                        placeholder="الكود المحول سيظهر هنا..."
                                        value={convertedCode}
                                        readOnly
                                    />
                                </div>
                            </div>

                            {/* Convert Button */}
                            <div className="mt-6 flex flex-col items-center">
                                <button
                                    onClick={handleConvert}
                                    disabled={isConverting}
                                    className="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:bg-gray-400 disabled:cursor-not-allowed transition-all transform hover:scale-105 active:scale-95"
                                >
                                    {isConverting ? (
                                        <span className="flex items-center gap-2">
                                            <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" />
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                                            </svg>
                                            جاري التحويل...
                                        </span>
                                    ) : (
                                        'تحويل الكود'
                                    )}
                                </button>
                                
                                {error && (
                                    <div className="mt-4 px-4 py-2 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                                        {error}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className={`mt-6 text-center text-sm ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                            مدعوم بواسطة Claude AI
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TransCode />);
    </script>
</body>
</html>
