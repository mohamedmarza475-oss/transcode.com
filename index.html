<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم حياتي الدراسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useMemo, useState, useEffect } = React;

        const STORAGE_KEY = 'life-study-planner-v1';

        const defaultData = {
            profile: {
                name: '',
                stage: '',
                dailyHoursGoal: 4,
                socialLimitMinutes: 60,
            },
            tasks: [],
            sessions: [],
            results: [],
            habits: [],
        };

        const todayISO = () => new Date().toISOString().slice(0, 10);

        const statusStyles = {
            pending: 'bg-amber-100 text-amber-800',
            doing: 'bg-blue-100 text-blue-800',
            done: 'bg-emerald-100 text-emerald-800',
        };

        function App() {
            const [data, setData] = useState(defaultData);
            const [activeTab, setActiveTab] = useState('dashboard');

            const [taskForm, setTaskForm] = useState({ title: '', subject: '', dueDate: '', priority: 'متوسط' });
            const [sessionForm, setSessionForm] = useState({ subject: '', minutes: 50, notes: '', date: todayISO() });
            const [resultForm, setResultForm] = useState({ exam: '', subject: '', score: '', total: '', note: '', date: todayISO() });
            const [habitForm, setHabitForm] = useState({ title: '', done: false, date: todayISO() });

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        setData(JSON.parse(saved));
                    } catch {
                        setData(defaultData);
                    }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const studyMinutesToday = useMemo(() => {
                const t = todayISO();
                return data.sessions.filter(s => s.date === t).reduce((sum, s) => sum + Number(s.minutes || 0), 0);
            }, [data.sessions]);

            const doneTasks = useMemo(() => data.tasks.filter(t => t.status === 'done').length, [data.tasks]);

            const averageScore = useMemo(() => {
                if (!data.results.length) return 0;
                const percentages = data.results
                    .map(r => (Number(r.total) > 0 ? (Number(r.score) / Number(r.total)) * 100 : 0));
                return Math.round(percentages.reduce((a, b) => a + b, 0) / percentages.length);
            }, [data.results]);

            const socialMinutesToday = useMemo(() => {
                const item = data.habits.find(h => h.date === todayISO() && h.title === 'وقت السوشيال (دقيقة)');
                return Number(item?.value || 0);
            }, [data.habits]);

            const addTask = (e) => {
                e.preventDefault();
                if (!taskForm.title.trim()) return;
                setData(prev => ({
                    ...prev,
                    tasks: [{ id: Date.now(), ...taskForm, status: 'pending' }, ...prev.tasks],
                }));
                setTaskForm({ title: '', subject: '', dueDate: '', priority: 'متوسط' });
            };

            const updateTaskStatus = (id, status) => {
                setData(prev => ({
                    ...prev,
                    tasks: prev.tasks.map(t => t.id === id ? { ...t, status } : t),
                }));
            };

            const addSession = (e) => {
                e.preventDefault();
                if (!sessionForm.subject.trim()) return;
                setData(prev => ({
                    ...prev,
                    sessions: [{ id: Date.now(), ...sessionForm, minutes: Number(sessionForm.minutes) }, ...prev.sessions],
                }));
                setSessionForm({ subject: '', minutes: 50, notes: '', date: todayISO() });
            };

            const addResult = (e) => {
                e.preventDefault();
                if (!resultForm.exam.trim()) return;
                setData(prev => ({
                    ...prev,
                    results: [{ id: Date.now(), ...resultForm }, ...prev.results],
                }));
                setResultForm({ exam: '', subject: '', score: '', total: '', note: '', date: todayISO() });
            };

            const addHabit = (e) => {
                e.preventDefault();
                if (!habitForm.title.trim()) return;
                setData(prev => ({
                    ...prev,
                    habits: [{ id: Date.now(), ...habitForm }, ...prev.habits],
                }));
                setHabitForm({ title: '', done: false, date: todayISO() });
            };

            const setSocialMinutes = (minutes) => {
                const date = todayISO();
                setData(prev => {
                    const existing = prev.habits.find(h => h.date === date && h.title === 'وقت السوشيال (دقيقة)');
                    if (existing) {
                        return {
                            ...prev,
                            habits: prev.habits.map(h => h.id === existing.id ? { ...h, value: minutes } : h),
                        };
                    }
                    return {
                        ...prev,
                        habits: [{ id: Date.now(), title: 'وقت السوشيال (دقيقة)', date, value: minutes }, ...prev.habits],
                    };
                });
            };

            const completionRate = data.tasks.length ? Math.round((doneTasks / data.tasks.length) * 100) : 0;
            const socialExceeded = socialMinutesToday > Number(data.profile.socialLimitMinutes || 0);

            return (
                <div className="min-h-screen bg-gradient-to-b from-slate-100 to-indigo-100 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-5">
                            <h1 className="text-3xl font-bold text-slate-800 mb-2">منظم حياتي الدراسية</h1>
                            <p className="text-slate-600">برنامج واحد لمتابعة المذاكرة، الإنجاز، النتائج، وتنظيم حياتك بعيدًا عن إدمان السوشيال ميديا.</p>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-5">
                            {[
                                ['dashboard', 'لوحة التحكم'],
                                ['tasks', 'المهام'],
                                ['sessions', 'جلسات المذاكرة'],
                                ['results', 'النتائج'],
                                ['habits', 'العادات'],
                            ].map(([key, label]) => (
                                <button
                                    key={key}
                                    onClick={() => setActiveTab(key)}
                                    className={`rounded-xl px-3 py-2 text-sm font-semibold transition ${activeTab === key ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-50'}`}
                                >
                                    {label}
                                </button>
                            ))}
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="grid md:grid-cols-2 gap-4">
                                <Card title="الملف الشخصي">
                                    <div className="space-y-2">
                                        <Input label="اسمك" value={data.profile.name} onChange={(v) => setData(p => ({ ...p, profile: { ...p.profile, name: v } }))} />
                                        <Input label="المرحلة الدراسية" value={data.profile.stage} onChange={(v) => setData(p => ({ ...p, profile: { ...p.profile, stage: v } }))} />
                                        <Input type="number" label="هدف الدراسة اليومي (ساعة)" value={data.profile.dailyHoursGoal} onChange={(v) => setData(p => ({ ...p, profile: { ...p.profile, dailyHoursGoal: v } }))} />
                                        <Input type="number" label="حد السوشيال اليومي (دقيقة)" value={data.profile.socialLimitMinutes} onChange={(v) => setData(p => ({ ...p, profile: { ...p.profile, socialLimitMinutes: v } }))} />
                                    </div>
                                </Card>

                                <Card title="ملخص اليوم">
                                    <SummaryItem label="دقائق المذاكرة اليوم" value={`${studyMinutesToday} دقيقة`} />
                                    <SummaryItem label="نسبة إنجاز المهام" value={`${completionRate}%`} />
                                    <SummaryItem label="متوسط نتائجك" value={`${averageScore}%`} />
                                    <div className={`mt-2 rounded-lg p-3 text-sm font-semibold ${socialExceeded ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                        {socialExceeded ? '⚠️ تجاوزت حد السوشيال اليوم.' : '✅ أنت ملتزم بحد السوشيال اليوم.'}
                                    </div>
                                    <div className="mt-3">
                                        <label className="text-sm font-semibold text-slate-700">وقت السوشيال اليوم (دقيقة)</label>
                                        <input
                                            type="number"
                                            className="mt-1 w-full rounded-lg border border-slate-300 p-2"
                                            value={socialMinutesToday}
                                            onChange={(e) => setSocialMinutes(Number(e.target.value || 0))}
                                        />
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'tasks' && (
                            <Card title="المهام التي عليك فعلها">
                                <form onSubmit={addTask} className="grid md:grid-cols-4 gap-2 mb-4">
                                    <input className="rounded-lg border p-2" placeholder="المهمة" value={taskForm.title} onChange={(e) => setTaskForm({ ...taskForm, title: e.target.value })} />
                                    <input className="rounded-lg border p-2" placeholder="المادة" value={taskForm.subject} onChange={(e) => setTaskForm({ ...taskForm, subject: e.target.value })} />
                                    <input type="date" className="rounded-lg border p-2" value={taskForm.dueDate} onChange={(e) => setTaskForm({ ...taskForm, dueDate: e.target.value })} />
                                    <button className="rounded-lg bg-indigo-600 text-white font-semibold">إضافة</button>
                                </form>
                                <div className="space-y-2">
                                    {data.tasks.map(task => (
                                        <div key={task.id} className="border rounded-lg p-3 bg-slate-50">
                                            <div className="flex flex-wrap items-center justify-between gap-2">
                                                <div>
                                                    <h3 className="font-semibold text-slate-800">{task.title}</h3>
                                                    <p className="text-sm text-slate-600">{task.subject || 'بدون مادة'} {task.dueDate ? `• ${task.dueDate}` : ''}</p>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-xs px-2 py-1 rounded-full ${statusStyles[task.status]}`}>{task.status}</span>
                                                    <select className="rounded border p-1" value={task.status} onChange={(e) => updateTaskStatus(task.id, e.target.value)}>
                                                        <option value="pending">لم يبدأ</option>
                                                        <option value="doing">جاري</option>
                                                        <option value="done">تم</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {!data.tasks.length && <p className="text-slate-500">لا توجد مهام بعد.</p>}
                                </div>
                            </Card>
                        )}

                        {activeTab === 'sessions' && (
                            <Card title="سجل جلسات المذاكرة">
                                <form onSubmit={addSession} className="grid md:grid-cols-4 gap-2 mb-4">
                                    <input className="rounded-lg border p-2" placeholder="المادة" value={sessionForm.subject} onChange={(e) => setSessionForm({ ...sessionForm, subject: e.target.value })} />
                                    <input type="number" className="rounded-lg border p-2" placeholder="الدقائق" value={sessionForm.minutes} onChange={(e) => setSessionForm({ ...sessionForm, minutes: e.target.value })} />
                                    <input type="date" className="rounded-lg border p-2" value={sessionForm.date} onChange={(e) => setSessionForm({ ...sessionForm, date: e.target.value })} />
                                    <button className="rounded-lg bg-indigo-600 text-white font-semibold">حفظ الجلسة</button>
                                    <input className="md:col-span-4 rounded-lg border p-2" placeholder="ملاحظات" value={sessionForm.notes} onChange={(e) => setSessionForm({ ...sessionForm, notes: e.target.value })} />
                                </form>
                                <ListEmpty items={data.sessions} emptyText="لا توجد جلسات بعد.">
                                    {data.sessions.map(s => (
                                        <li key={s.id} className="border-b py-2 text-slate-700">{s.date} • {s.subject} • {s.minutes} دقيقة {s.notes ? `• ${s.notes}` : ''}</li>
                                    ))}
                                </ListEmpty>
                            </Card>
                        )}

                        {activeTab === 'results' && (
                            <Card title="متابعة النتائج">
                                <form onSubmit={addResult} className="grid md:grid-cols-5 gap-2 mb-4">
                                    <input className="rounded-lg border p-2" placeholder="الاختبار" value={resultForm.exam} onChange={(e) => setResultForm({ ...resultForm, exam: e.target.value })} />
                                    <input className="rounded-lg border p-2" placeholder="المادة" value={resultForm.subject} onChange={(e) => setResultForm({ ...resultForm, subject: e.target.value })} />
                                    <input type="number" className="rounded-lg border p-2" placeholder="درجتك" value={resultForm.score} onChange={(e) => setResultForm({ ...resultForm, score: e.target.value })} />
                                    <input type="number" className="rounded-lg border p-2" placeholder="من" value={resultForm.total} onChange={(e) => setResultForm({ ...resultForm, total: e.target.value })} />
                                    <button className="rounded-lg bg-indigo-600 text-white font-semibold">إضافة نتيجة</button>
                                    <input type="date" className="rounded-lg border p-2" value={resultForm.date} onChange={(e) => setResultForm({ ...resultForm, date: e.target.value })} />
                                    <input className="md:col-span-4 rounded-lg border p-2" placeholder="ماذا ستفعل للتحسين؟" value={resultForm.note} onChange={(e) => setResultForm({ ...resultForm, note: e.target.value })} />
                                </form>
                                <ListEmpty items={data.results} emptyText="لا توجد نتائج بعد.">
                                    {data.results.map(r => {
                                        const percent = Number(r.total) ? Math.round((Number(r.score) / Number(r.total)) * 100) : 0;
                                        return <li key={r.id} className="border-b py-2 text-slate-700">{r.date} • {r.exam} ({r.subject}) • {r.score}/{r.total} = {percent}% {r.note ? `• ${r.note}` : ''}</li>;
                                    })}
                                </ListEmpty>
                            </Card>
                        )}

                        {activeTab === 'habits' && (
                            <Card title="عادات الانضباط والابتعاد عن الإدمان">
                                <form onSubmit={addHabit} className="grid md:grid-cols-3 gap-2 mb-4">
                                    <input className="rounded-lg border p-2" placeholder="العادة (مثال: بدون سوشيال بعد الاستيقاظ)" value={habitForm.title} onChange={(e) => setHabitForm({ ...habitForm, title: e.target.value })} />
                                    <input type="date" className="rounded-lg border p-2" value={habitForm.date} onChange={(e) => setHabitForm({ ...habitForm, date: e.target.value })} />
                                    <button className="rounded-lg bg-indigo-600 text-white font-semibold">إضافة عادة</button>
                                </form>
                                <ListEmpty items={data.habits.filter(h => h.title !== 'وقت السوشيال (دقيقة)')} emptyText="لا توجد عادات بعد.">
                                    {data.habits.filter(h => h.title !== 'وقت السوشيال (دقيقة)').map(h => (
                                        <li key={h.id} className="border-b py-2 flex items-center justify-between">
                                            <span>{h.date} • {h.title}</span>
                                            <button onClick={() => setData(prev => ({ ...prev, habits: prev.habits.map(x => x.id === h.id ? { ...x, done: !x.done } : x) }))} className={`text-xs px-2 py-1 rounded ${h.done ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-700'}`}>
                                                {h.done ? 'تم ✅' : 'غير مكتمل'}
                                            </button>
                                        </li>
                                    ))}
                                </ListEmpty>
                                <div className="mt-4 text-sm text-slate-600 bg-slate-50 rounded-lg p-3">
                                    نصيحة سريعة: اجعل حد السوشيال ثابت، وضع الهاتف بعيدًا في جلسات المذاكرة، وسجّل التزامك يوميًا.
                                </div>
                            </Card>
                        )}
                    </div>
                </div>
            );
        }

        const Card = ({ title, children }) => (
            <div className="bg-white rounded-2xl shadow p-4 md:p-5">
                <h2 className="text-xl font-bold text-slate-800 mb-3">{title}</h2>
                {children}
            </div>
        );

        const SummaryItem = ({ label, value }) => (
            <div className="flex justify-between border-b py-2 text-slate-700">
                <span>{label}</span>
                <strong>{value}</strong>
            </div>
        );

        const Input = ({ label, type = 'text', value, onChange }) => (
            <label className="block">
                <span className="text-sm font-semibold text-slate-700">{label}</span>
                <input type={type} value={value} onChange={(e) => onChange(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-300 p-2" />
            </label>
        );

        const ListEmpty = ({ items, children, emptyText }) => (
            <ul>
                {items.length ? children : <p className="text-slate-500">{emptyText}</p>}
            </ul>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
